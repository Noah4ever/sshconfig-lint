[package]
name = "sshconfig-lint"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
authors = ["Noah"]
description = "Linter for OpenSSH client config files"
license = "MIT"
repository = "https://github.com/Noah4ever/sshconfig-lint"
homepage = "https://sshconfig-lint.apps.thiering.org"
keywords = ["ssh", "openssh", "linter", "security", "configuration"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
exclude = [
    "aur/",
    "editors/",
    "Formula/",
    "install.sh",
    ".github/",
    "tests/documentation_contract.rs",
]

[[bin]]
name = "sshconfig-lint"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
glob = "0.3"
dirs = "5.0"
serde_json = "1.0"
tokio = { version = "1.47", features = ["io-std", "rt", "sync"] }
tower-lsp = "0.20"

[dev-dependencies]
tempfile = "3"
insta = "1"
assert_cmd = "2"
predicates = "3"
