name: Action smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - action.yml
      - scripts/install-action.sh
      - scripts/install-action.ps1
      - .github/workflows/action-smoke.yml
  pull_request:
    branches: [main]
    paths:
      - action.yml
      - scripts/install-action.sh
      - scripts/install-action.ps1
      - .github/workflows/action-smoke.yml

permissions:
  contents: read

jobs:
  action:
    name: Action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Create smoke-test configs
        shell: bash
        run: |
          mkdir -p .ssh
          printf 'Host *\n  User deploy\n\nHost work\n  User alice\n' > .ssh/config
          printf 'Host work\n  HostName work.example.com\n  User deploy\n' > .ssh/clean_config

      - name: Accept a clean config through the local Action
        uses: ./
        with:
          paths: .ssh/clean_config
          version: v0.5.0
          no-includes: true

      - name: Propagate a strict warning through the local Action
        id: lint
        continue-on-error: true
        uses: ./
        with:
          paths: .ssh/config
          version: v0.5.0
          strict: true
          no-includes: true

      - name: Require the strict warning to fail
        if: steps.lint.outcome != 'failure'
        shell: bash
        run: |
          echo 'The Action did not propagate the expected strict exit code.' >&2
          exit 1
