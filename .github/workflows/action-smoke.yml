name: Action smoke test

on:
  workflow_dispatch:

jobs:
  action:
    name: Action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Create a config with a warning
        shell: bash
        run: |
          mkdir -p .ssh
          printf 'Host *\n  User deploy\n\nHost work\n  User alice\n' > .ssh/config

      - name: Exercise the published binary through the Action
        id: lint
        continue-on-error: true
        uses: Noah4ever/sshconfig-lint@v0.5.0-rc.2
        with:
          paths: .ssh/config
          strict: true
          no-includes: true

      - name: Require the strict warning to fail
        if: steps.lint.outcome != 'failure'
        shell: bash
        run: |
          echo 'The Action did not propagate the expected strict exit code.' >&2
          exit 1
