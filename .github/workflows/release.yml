name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: sshconfig-lint
            asset_name: linux-x86_64
            builder: cargo
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: sshconfig-lint
            asset_name: linux-arm64
            builder: cross
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            bin_name: sshconfig-lint
            asset_name: linux-musl-x86_64
            builder: cross
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            bin_name: sshconfig-lint
            asset_name: linux-musl-arm64
            builder: cross
          - target: x86_64-apple-darwin
            os: macos-latest
            bin_name: sshconfig-lint
            asset_name: macos-x86_64
            builder: cargo
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: sshconfig-lint
            asset_name: macos-arm64
            builder: cargo
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: sshconfig-lint.exe
            asset_name: windows-x86_64
            builder: cargo
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            bin_name: sshconfig-lint.exe
            asset_name: windows-arm64
            builder: cargo

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: taiki-e/install-action@cross
        if: matrix.builder == 'cross'

      - name: Build with Cargo
        if: matrix.builder == 'cargo'
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build with Cross
        if: matrix.builder == 'cross'
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Create artifact directory
        run: mkdir -p artifacts

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          out="sshconfig-lint-${{ matrix.asset_name }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "artifacts/${out}"
          chmod +x "artifacts/${out}"
          tar -C artifacts -czf "artifacts/${out}.tar.gz" "${out}"
          rm "artifacts/${out}"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "sshconfig-lint-${{ matrix.asset_name }}.exe"
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.bin_name }}" "artifacts\$out"

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.asset_name }}
          path: artifacts/
          if-no-files-found: error

  create-release:
    name: Create verified release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare checksums
        run: |
          mkdir -p release-artifacts
          find artifacts -maxdepth 2 -type f -exec mv {} release-artifacts/ \;
          cd release-artifacts
          sha256sum -- sshconfig-lint-* > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-artifacts/*

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
